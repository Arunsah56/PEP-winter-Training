<h1>To Do App</h1>

<a href="{% url 'add-task' %}">Add Task</a>

{% for category in categories %}
    <h2>{{ category.name }}</h2>

    <ul>
        {% for task in category.tasks.all %}
            <li>
                {{ task.title }}

                {% if task.completed %}
                    ✔ Done
                {% endif %}

                <a href="{% url 'update-task' task.id %}">Edit</a>
                <a href="{% url 'delete-task' task.id %}">Delete</a>
            </li>
        {% empty %}
            <li>No tasks</li>
        {% endfor %}
    </ul>

{% endfor %}
